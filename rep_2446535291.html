function dist(a,b){let r=Math.PI/180,dl=(b.lon-a.lon)*r,dp=(b.lat-a.lat)*r;let q=Math.sin(dp/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dl/2)**2;return 6371*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q));}

  navigator.geolocation.getCurrentPosition(success,e2=>{
   gpsPending=false;locateBtn.disabled=false;
   setMessage('تعذر تحديد موقعك: '+e2.message+'. تأكد من تفعيل الموقع وفتح الرابط في المتصفح الخارجي، أو اضغط على الخريطة لاختيار نقطة بداية يدويًا.');
  },{enableHighAccuracy:false,timeout:12000,maximumAge:120000});
 };
 navigator.geolocation.getCurrentPosition(success,failure,{enableHighAccuracy:true,timeout:12000,maximumAge:30000});
}
locateBtn.addEventListener('click',requestLocation);
const manual=document.createElement('button');manual.textContent='اختيار نقطة البداية من الخريطة';manual.style.cssText='margin:7px 5px;padding:8px;cursor:pointer';locateBtn.after(manual);

map.on('click',event=>{if(choosing){choosing=false;completePosition(event.latlng.lat,event.latlng.lng);}});
