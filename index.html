<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POS Maps - Test</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa}header{padding:14px;background:#123e66;color:white}#map{height:72vh}#status{padding:12px}button{background:#1469ac;color:white;border:0;border-radius:7px;padding:10px;cursor:pointer}</style></head><body><header><strong>خريطة نقاط البيع - اختبار تجريبي</strong></header><div id="map"></div><div id="status"><button id="locate">تحديد موقعي الحالي</button> <span id="msg">اضغط على أي علامة لعرض الاتجاهات</span></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map').setView([30.058,31.259],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors'}).addTo(map);const points=[['TEST-001','نقطة بيع تجريبية 1',30.0444,31.2357],['TEST-002','نقطة بيع تجريبية 2',30.0626,31.2497],['TEST-003','نقطة بيع تجريبية 3',30.0871,31.3242]];points.forEach(p=>{const url='https://www.google.com/maps/dir/?api=1&destination='+p[2]+','+p[3]+'&travelmode=driving';L.marker([p[2],p[3]]).addTo(map).bindPopup('<b>'+p[0]+'</b><p>'+p[1]+'</p><a href="'+url+'" target="_blank" rel="noopener">الاتجاهات عبر Google Maps</a>')});let selfMarker;document.getElementById('locate').onclick=()=>{const msg=document.getElementById('msg');if(!navigator.geolocation){msg.textContent='المتصفح لا يدعم تحديد الموقع';return}msg.textContent='جارٍ تحديد الموقع...';navigator.geolocation.getCurrentPosition(pos=>{const ll=[pos.coords.latitude,pos.coords.longitude];if(selfMarker)map.removeLayer(selfMarker);selfMarker=L.circleMarker(ll,{radius:9,color:'#1976d2',fillOpacity:0.9}).addTo(map).bindPopup('موقعي الحالي');map.setView(ll,13);msg.textContent='تم تحديد الموقع';},err=>{msg.textContent='تعذر تحديد الموقع: تأكد من السماح بالوصول للموقع واستخدام HTTPS';},{enableHighAccuracy:true,timeout:15000})};</script></body></html>
